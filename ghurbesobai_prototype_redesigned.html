<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

    --forest:#0E7C66; --forest-2:#0A5E4E; --teal:#0FA3A3; --sand:#FFF3E1;
    --sunset:#FF7A45; --sunset-2:#E85D2E; --sky:#2E86DE; --gold:#F5A623;
    --line:#E3ECE9; --danger:#D8483A; --ok:#1E9E6B;
    --radius:14px; --radius-sm:9px;
    --shadow:0 6px 20px rgba(14,60,50,.08); --shadow-lg:0 16px 40px rgba(14,60,50,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;}

  h1,h2,h3,.serif{font-family:'Poppins',sans-serif;font-weight:700;letter-spacing:-0.01em;}
  #root{max-width:1160px;margin:0 auto;padding:0 20px 0;}

  button{font-family:inherit;cursor:pointer;}

  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(232,93,46,.4);}
  .btn.ghost{background:#fff;color:var(--forest);border:2px solid var(--forest);box-shadow:none;}
  .btn.ghost:hover{background:var(--forest);color:#fff;transform:translateY(-2px);}
  .btn.clay{background:linear-gradient(135deg,var(--forest),var(--forest-2));box-shadow:0 8px 20px rgba(14,94,78,.32);}
  .btn.clay:hover{box-shadow:0 12px 26px rgba(14,94,78,.4);}
  .btn.small{padding:9px 16px;font-size:13px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;margin:16px 0 32px;background:#fff;border-radius:999px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:30;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand .mark-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--forest),var(--teal));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .brand .mark{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;color:var(--forest);line-height:1.1;}
  .brand .tag{font-size:11px;color:var(--ink-soft);}
  .topnav{display:flex;gap:8px;font-size:13.5px;color:var(--ink-soft);align-items:center;}
  .topnav span{cursor:pointer;padding:9px 16px;border-radius:999px;font-weight:600;transition:background .15s,color .15s;}
  .topnav span:hover{background:var(--sand);color:var(--sunset-2);}
  /* hero */
  .hero{position:relative;padding:56px 40px;display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center;margin-bottom:44px;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,var(--forest) 0%,var(--forest-2) 46%,#0A4A3E 100%);color:#fff;}
  .hero::before{content:'';position:absolute;inset:0;background:
     radial-gradient(circle at 85% 15%, rgba(255,255,255,.14) 0%, transparent 40%),
     radial-gradient(circle at 15% 90%, rgba(255,122,69,.28) 0%, transparent 45%);pointer-events:none;}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;margin-bottom:18px;backdrop-filter:blur(4px);}
  .hero h1{font-size:44px;line-height:1.1;margin:0 0 16px;color:#fff;position:relative;}
  .hero h1 .accent{color:var(--gold);}
  .hero p.lede{font-size:16px;color:rgba(255,255,255,.86);max-width:48ch;margin:0 0 26px;line-height:1.55;position:relative;}
  .hero .ctas{display:flex;gap:12px;flex-wrap:wrap;position:relative;}
  .hero .stats{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:26px;backdrop-filter:blur(6px);}
  .hero .stats .n{font-family:'Poppins',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1;}
  .hero .stats .l{font-size:12px;color:rgba(255,255,255,.78);margin-top:4px;}
  .hero .stats .row{margin-bottom:18px;display:flex;align-items:center;gap:14px;}
  .hero .stats .row .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .search-box{margin-top:20px;position:relative;max-width:440px;}
  .search-box input{width:100%;padding:15px 18px;border:none;background:#fff;font-size:14.5px;border-radius:999px;box-shadow:var(--shadow);}
  .search-box input:focus{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.5);}
  .search-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:16px;z-index:20;max-height:280px;overflow:auto;box-shadow:var(--shadow-lg);}
  .search-drop .item{padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;color:var(--ink);}
  .search-drop .item:last-child{border-bottom:none;}
  .search-drop .item:hover{background:var(--sand);}
  .search-drop .item small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px;}
  /* terrain chips -> category cards */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .section-label{font-size:22px;font-weight:700;font-family:'Poppins',sans-serif;color:var(--ink);}
  .section-sub{font-size:13.5px;color:var(--ink-soft);}
  .chip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:56px;}
  .chip{border:none;background:#fff;border-radius:var(--radius);cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;box-shadow:var(--shadow);overflow:hidden;padding:16px 16px;}
  .chip:has(.cat-art){padding:0;}
  .chip:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
  .chip .t{font-family:'Poppins',sans-serif;font-size:15.5px;font-weight:700;margin-bottom:3px;}
  .chip .c{font-size:12px;color:var(--ink-soft);}
  .chip .cat-art{height:96px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;}
  .chip .cat-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%, rgba(0,0,0,.12) 100%);}
  .chip .cat-body{padding:14px 16px;}
  .price-badge{display:inline-block;background:var(--sand);color:var(--sunset-2);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;}
  .rating-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  /* form */
  .form-wrap{max-width:700px;background:#fff;border-radius:24px;padding:36px;box-shadow:var(--shadow);}
  .f-section{padding:22px 0;border-bottom:1px solid var(--line);}
  .f-section:first-child{padding-top:0;}
  .f-label{font-size:14.5px;font-weight:700;margin-bottom:4px;color:var(--ink);}
  .f-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.4;}
  .f-row{display:flex;gap:10px;flex-wrap:wrap;}
  .opt{border:2px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;background:#fff;user-select:none;font-weight:500;transition:border-color .12s, background .12s, color .12s;}
  .opt:hover{border-color:var(--teal);}
  .opt.sel{background:linear-gradient(135deg,var(--forest),var(--teal));color:#fff;border-color:transparent;}
  .f-input{padding:12px 14px;border:2px solid var(--line);background:#fff;font-size:14px;border-radius:var(--radius-sm);width:100%;}
  .f-input:focus{outline:none;border-color:var(--teal);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .slider-wrap{padding-top:6px;}
  input[type=range]{width:100%;accent-color:var(--sunset);}
  .slider-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  /* rank cards */
  .rank-card{display:grid;grid-template-columns:76px 1fr;gap:20px;padding:26px;margin-bottom:18px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border-top:5px solid var(--forest);}
  .rank-num{font-family:'Poppins',sans-serif;font-size:16px;font-weight:800;color:#fff;line-height:1;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--sunset),var(--sunset-2));display:flex;align-items:center;justify-content:center;}
  .rank-title{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .rank-title h3{font-size:22px;margin:0;}
  .rank-title .bn{font-size:13px;color:var(--ink-soft);margin-left:8px;font-weight:400;}
  .match-badge{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--forest),var(--teal));padding:6px 14px;border-radius:999px;white-space:nowrap;}
  .rank-meta{font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .rank-facts{display:flex;flex-wrap:wrap;gap:22px;font-size:13px;margin-bottom:14px;background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px;}
  .rank-facts b{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em;}
  .why-list{margin:0 0 10px;padding:0;list-style:none;font-size:13.5px;}
  .why-list li{padding:4px 0;color:var(--ok);font-weight:500;}
  .warn-list{margin:0 0 14px;padding:0;list-style:none;font-size:13.5px;}
  .warn-list li{padding:4px 0;color:var(--danger);font-weight:500;}
  .rank-cta{display:flex;gap:10px;}
  /* comparison table */
  table.cmp{width:100%;border-collapse:collapse;font-size:13px;margin:20px 0 30px;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  table.cmp th,table.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;}
  table.cmp th{font-weight:700;color:var(--ink-soft);font-size:12px;background:var(--bg);}
  .cmp-wrap{overflow-x:auto;border-radius:var(--radius);}
  .best-pick{background:linear-gradient(135deg,var(--sand),#fff);border:2px solid var(--gold);border-radius:var(--radius);padding:22px 24px;margin-bottom:40px;}
  .best-pick .k{font-size:12px;color:var(--sunset-2);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  /* detail */
  .detail-hero{padding:0;margin-bottom:28px;}
  .terrain-art{height:180px;border-radius:var(--radius);margin-bottom:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:var(--shadow);}
  .terrain-art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%, rgba(0,0,0,.28) 100%);}
  .detail-hero h1{font-size:32px;margin:0 0 6px;}
  .detail-facts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:16px;}
  .detail-facts > div{background:#fff;border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow);}
  .detail-facts b{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em;}
  .why-box{background:var(--sand);border-radius:var(--radius-sm);padding:16px 18px;margin:18px 0;font-size:13.5px;}
  .block{margin-bottom:44px;}
  .block h2{font-size:21px;margin:0 0 16px;}
  .day-card{border:none;background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;}
  .day-card h4{font-family:'Poppins',sans-serif;font-size:16px;margin:0 0 12px;color:var(--forest);}
  .slot{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:start;}
  .slot:first-of-type{border-top:none;}
  .slot .tm{color:var(--ink-soft);font-size:12px;padding-top:2px;font-weight:600;}
  .slot .cost{color:var(--forest);font-weight:700;white-space:nowrap;}
  .day-total{text-align:right;font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .cost-table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px;}
  .cost-table td{padding:9px 0;border-bottom:1px solid var(--line);}
  .cost-table td:last-child{text-align:right;font-weight:600;}
  .cost-table tr.total td{font-weight:800;border-top:2px solid var(--forest);border-bottom:none;padding-top:12px;color:var(--forest);font-size:16px;}
  .note{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:10px;}
  .nearby-row{display:grid;grid-template-columns:1fr repeat(4,auto);gap:16px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;background:#fff;}

  .nearby-row:last-child{border-radius:0 0 var(--radius) var(--radius);border-bottom:none;}
  .nearby-row .nm{font-weight:700;}
  .nearby-row .cat{font-size:11.5px;color:#fff;background:var(--forest);padding:2px 9px;border-radius:999px;display:inline-block;}
  .cat-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .tag-pill{display:inline-block;font-size:11px;padding:4px 11px;border:none;background:var(--bg);border-radius:999px;color:var(--ink-soft);font-weight:600;}
  .pack-list{columns:2;gap:24px;font-size:14px;line-height:1.9;}
  .safety-card{border-left:4px solid var(--sunset);background:#fff;box-shadow:var(--shadow);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:12px 16px;margin-bottom:14px;font-size:13.5px;line-height:1.55;}
  .safety-card b{display:block;font-size:12.5px;color:var(--forest);font-weight:700;margin-bottom:3px;}
  .badge-warn{display:inline-block;background:#FDE7DE;color:var(--sunset-2);font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:11px;margin-right:8px;}
  .map-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--forest);font-weight:600;text-decoration:none;margin-bottom:16px;}
  .radial-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:8px;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .empty{padding:40px 24px;color:var(--ink-soft);font-size:14px;background:#fff;border-radius:var(--radius);text-align:center;box-shadow:var(--shadow);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 22px;font-size:13.5px;border-radius:999px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:var(--shadow-lg);}

  .quality-flag{font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);padding:2px 8px;border-radius:10px;background:#fff;}
  .trip-card{border:none;background:#fff;box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .season-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:10px;}
  .season-box{background:#fff;box-shadow:var(--shadow);border-radius:var(--radius-sm);padding:14px 16px;}
  .season-box .k{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .season-box .v{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;color:var(--forest);}
  .trust-strip{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-around;padding:28px 30px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:56px;}
  .trust-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .trust-item .ic{font-size:22px;}
  .site-footer{margin-top:64px;background:linear-gradient(135deg,var(--forest-2),#08382E);color:rgba(255,255,255,.88);border-radius:28px 28px 0 0;padding:48px 40px 28px;}
  .site-footer h4{color:#fff;font-family:'Poppins',sans-serif;font-size:14px;margin:0 0 14px;}
  .site-footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px;}
  .site-footer a{display:block;font-size:13px;color:rgba(255,255,255,.72);text-decoration:none;margin-bottom:9px;}
  .site-footer a:hover{color:#fff;}
  .site-footer .bottom{border-top:1px solid rgba(255,255,255,.16);padding-top:20px;font-size:12px;color:rgba(255,255,255,.6);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  @media(max-width:720px){
    .hero{grid-template-columns:1fr;padding:36px 22px;}
    .hero h1{font-size:32px;}
    .chip-grid{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    table.cmp{min-width:640px;}
    .pack-list{columns:1;}
    .rank-card{grid-template-columns:44px 1fr;padding:18px;}
    .nearby-row{grid-template-columns:1fr;gap:4px;}
    .form-wrap{padding:22px;}
    .site-footer .cols{grid-template-columns:1fr 1fr;}
    .trust-strip{gap:16px;padding:20px;}
  }
</style>

function parseNums(s){ if(!s) return []; return String(s).split(',').map(x=>parseInt(x.trim(),10)).filter(n=>!isNaN(n)); }
function fmtBDT(n){ if(n===null||n===undefined||isNaN(n)) return '\u09F3 \u2014'; return '\u09F3' + Math.round(n).toLocaleString('en-US'); }

/* ---------- scoring engine ---------- */
const WEIGHTS = { budget:.15, season:.15, terrain:.10, experience:.15, activity:.10, crowd:.10, traveler:.10, accommodation:.05, duration:.05, safety:.05 };

function budgetScore(d,budget){
  if(!budget) return 70;
  const low=d.overall_daily_budget_low_bdt, mid=d.overall_daily_budget_mid_bdt, high=d.overall_daily_budget_high_bdt;
  if(budget>=high) return 100;
  if(budget>=mid) return 85 + 15*((budget-mid)/Math.max(1,high-mid));
  if(budget>=low) return 60 + 25*((budget-mid+ (mid-low))/Math.max(1,mid-low)); // interpolate low..mid -> 60..85
  return Math.max(0, 55*(budget/Math.max(1,low)));
}
function seasonScore(d,month){
  if(!month) return 65;
  const best=parseNums(d.best_months_numeric), good=parseNums(d.good_months_numeric), worst=parseNums(d.worst_months_numeric);
  if(best.includes(month)) return 100;
  if(good.includes(month)) return 75;
  if(worst.includes(month)) return 18;
  return 55;
}
function terrainScore(d,terrains){
  if(!terrains||!terrains.length) return 100;
  return terrains.includes(d.terrain_key) ? 100 : 25;
}
function experienceScore(d,exps){
  if(!exps||!exps.length) return 100;
  const tags = (d.experience_tags||'').toLowerCase();
  const matched = exps.filter(e=>tags.includes(e.toLowerCase())).length;
  return Math.round(100*matched/exps.length);
}
function activityScore(d,acts){
  if(!acts||!acts.length) return 100;
  const names = activityNames(d).map(n=>n.toLowerCase());
  const matched = acts.filter(a=>names.some(n=>n.includes(a.toLowerCase())||a.toLowerCase().includes(n))).length;
  return Math.round(100*matched/acts.length);
}
function crowdScore(d,crowdPref,month){
  const line = d.crowd_level_by_month||'';
  const mName = MONTHS[month]||'';
  const m = line.match(new RegExp(mName.slice(0,3)+':([A-Za-z ]+)'));
  const word = m ? m[1].trim() : null;
  const val = word && CROWD_VAL[word]!==undefined ? CROWD_VAL[word] : 50;
  return Math.round(100 - Math.abs((crowdPref??50)-val));
}
function travelerScore(d,type){
  const map = {family:d.family_friendly_score, couple:d.couple_friendly_score, solo:d.solo_friendly_score, group:d.group_friendly_score};
  if(!type || !map[type]) return 100;
  return Math.round((map[type]/5)*100);
}
function accommodationScore(d,pref){
  if(!pref) return 100;
  const types=(d.accommodation_types||'').toLowerCase();
  return types.includes(pref.toLowerCase()) ? 100 : 40;
}
function durationScore(d,days){
  if(!days) return 70;
  const min=d.minimum_days_recommended||1, max=d.maximum_useful_days||min+2;
  if(days>=min && days<=max) return 100;
  if(days<min) return Math.max(20, 100-(min-days)*30);
  return Math.max(40, 100-(days-max)*12);
}
function safetyScore(d){
  let s=92;
  const scam=(d.scam_risk||'').toLowerCase();
  if(scam.includes('high')) s-=20; else if(scam.includes('medium')) s-=8;
  if(d.foreigner_friendly && d.foreigner_friendly!=='Yes') s-=10;
  if(d.permit_required==='Yes') s-=4;
  return Math.max(0,s);
}
function scoreDestination(d,p){
  const s = {
    budget:budgetScore(d,p.budget), season:seasonScore(d,p.month), terrain:terrainScore(d,p.terrain),
    experience:experienceScore(d,p.experience), activity:activityScore(d,p.activities),
    crowd:crowdScore(d,p.crowd,p.month), traveler:travelerScore(d,p.traveler),
    accommodation:accommodationScore(d,p.accommodation), duration:durationScore(d,p.duration), safety:safetyScore(d),
  };
  let overall=0; Object.keys(WEIGHTS).forEach(k=>overall+=s[k]*WEIGHTS[k]);
  return {overall:Math.round(overall), sub:s};
}
function explain(d,p,s){
  const good=[], warn=[];
  if(s.terrain>=75 && p.terrain?.length) good.push('Matches your '+p.terrain.map(t=>TERRAIN_LABEL[t]?.t||t).join('/')+' preference');
  if(s.season>=90) good.push('Your selected month ('+MONTHS[p.month]+') is one of the best times to visit');
  else if(s.season<=25) warn.push('Your selected month ('+MONTHS[p.month]+') is one of the least favorable times to visit');
  if(s.budget>=85 && p.budget) good.push('Comfortably fits your \u09F3'+p.budget+'/day budget');
  else if(s.budget<50 && p.budget) warn.push('Typical daily cost runs above your stated budget');
  if(s.experience>=80 && p.experience?.length) good.push('Strong overlap with your experience interests ('+p.experience.join(', ')+')');
  if(s.activity>=80 && p.activities?.length) good.push('Offers the specific activities you selected');
  if(s.traveler>=85 && p.traveler) good.push('Well-suited for '+p.traveler+' travel');
  if(s.duration>=90 && p.duration) good.push('Recommended stay length lines up with your '+p.duration+'-day trip');
  else if(s.duration<45 && p.duration) warn.push(p.duration+' days is a mismatch \u2014 ideal is '+(d.minimum_days_recommended)+'\u2013'+(d.maximum_useful_days)+' days');
  if(s.crowd<40) warn.push('Crowd levels in '+MONTHS[p.month]+' may not match your preference');
  if(d.photography_potential==='High'||d.photography_potential==='Exceptional') good.push('Rated '+d.photography_potential.toLowerCase()+' for photography');
  if(d.permit_required==='Yes') warn.push('Requires a permit \u2014 see Safety & Permits section');
  if(!good.length) good.push('A solid overall match based on your combined preferences');
  return {good:good.slice(0,5), warn:warn.slice(0,3)};
}
function hardConstraintOk(d,p){
  // NOTE: pet_friendly is "No" for all 100 destinations in the dataset —
  // a known, low-confidence unassessed default (per the data audit), not a
  // verified per-destination fact. Hard-excluding on it would silently
  // return zero destinations for every pet-traveling user, which is worse
  // than not filtering. We no longer exclude on it here; see explain()
  // and validateItinerary() for the honest warning shown instead.
  if(p.accessibility && d.elderly_suitable!=='Yes') return false;
  if(p.child && (d.physical_difficulty||1)>=4) return false;
  return true;
}
function runRecommendation(p){
  const pool = DATA.destinations.filter(d=>hardConstraintOk(d,p));
  const excludedConstraints = DATA.destinations.length - pool.length;
  const scored = pool.map(d=>({d, ...scoreDestination(d,p)}));
  let eligible = scored;
  let excluded = 0;
  if(p.budget){
    eligible = scored.filter(x=> p.budget >= x.d.overall_daily_budget_low_bdt*0.55 );
    excluded = scored.length - eligible.length;
  }
  eligible.sort((a,b)=>b.overall-a.overall);
  return {top:eligible.slice(0,3), excluded, excludedConstraints};
}

/* ---------- validation engine ---------- */
function validateItinerary(d, itinerary, days, p, totalCost){
  const errors=[], warnings=[];
  itinerary.forEach(day=>{
    const hours = Object.values(day.slots).filter(Boolean).reduce((s,x)=>s+(x.duration||0),0);
    if(hours>9) warnings.push(`Day ${day.day} looks packed (~${Math.round(hours)}h of scheduled activity) \u2014 consider trimming one stop.`);
  });
  const seen=new Set();
  itinerary.forEach(day=>Object.values(day.slots).filter(Boolean).forEach(s=>{
    if(seen.has(s.name)) errors.push(`"${s.name}" is scheduled more than once in this plan.`);
    seen.add(s.name);
  }));
  if(p.budget){
    const perDay = totalCost/Math.max(1,days);
    if(perDay > p.budget*1.05) warnings.push(`Over budget: est. ${fmtBDT(perDay)}/day vs your ${fmtBDT(p.budget)}/day target.`);
  }
  const sScore = seasonScore(d,p.month);
  if(sScore<=25) warnings.push(`${MONTHS[p.month]} is one of the least favorable months to visit ${d.name}.`);
  if(d.permit_required==='Yes') warnings.push('A permit is required for this destination \u2014 see Safety & Permits below.');
  if(days < (d.minimum_days_recommended||1)) warnings.push(`${days} day(s) is below the recommended minimum of ${d.minimum_days_recommended} \u2014 the plan may feel rushed.`);
  if(days > (d.maximum_useful_days||days)) warnings.push(`${days} days exceeds the ${d.maximum_useful_days}-day point where this destination typically stops adding value.`);
  if(p.pet) warnings.push('Pet policy is unverified for every destination in our dataset (a known data gap, not a judgement about this place) — please confirm locally before bringing a pet.');
  if(p.accessibility && d.elderly_suitable!=='Yes') errors.push('Not marked suitable for elderly or reduced-mobility travelers in our dataset. (Note: no destination in our dataset is currently marked wheelchair-accessible \u2014 this is a data gap, not a judgement about the place.)');
  if(p.child && (d.physical_difficulty||1)>=4) errors.push('Physical difficulty is high \u2014 may not be safe or comfortable for young children.');
  return {isValid: errors.length===0, errors, warnings};
}

/* ---------- itinerary + cost engine ---------- */
function buildItinerary(d, days, tripPeople){
  const nb = nearbyFor(d.place_id).slice().sort((a,b)=>a.distance_km-b.distance_km);
  const onsite = (d.activities||[]).slice();
  const byTime = arr => ({
    morning: arr.filter(a=>/morning|sunrise/i.test(a.b||a.ideal_time_of_day||'')),
    afternoon: arr.filter(a=>/afternoon|daytime|anytime/i.test(a.b||a.ideal_time_of_day||'')),
    evening: arr.filter(a=>/evening|sunset|night/i.test(a.b||a.ideal_time_of_day||'')),
  });
  const onsiteBuckets = byTime(onsite);
  const nbBuckets = { morning:[], afternoon:[], evening:[] };
  nb.forEach(p=>{
    const t=(p.ideal_time_of_day||'').toLowerCase();
    if(t.includes('morning')) nbBuckets.morning.push(p);
    else if(t.includes('afternoon')||t.includes('day')) nbBuckets.afternoon.push(p);
    else nbBuckets.evening.push(p);
  });
  const usedNb = new Set();
  const usedOnsiteNames = new Set();
  function nextOnsite(slot){
    while(onsiteBuckets[slot].length){
      const a = onsiteBuckets[slot].shift();
      if(!usedOnsiteNames.has(a.n)){ usedOnsiteNames.add(a.n); return a; }
    }
    return null;
  }
  const days_out = [];
  for(let day=1; day<=days; day++){
    const slots = {morning:null,afternoon:null,evening:null};
    ['morning','afternoon','evening'].forEach(slot=>{
      if(day===1){
        const a = nextOnsite(slot);
        if(a){ slots[slot] = {type:'onsite', name:a.n, note:(a.t?a.t+' activity':'On-site activity'), cost:a.c||0, transport:'On foot / local', duration:a.h}; return; }
      }
      const cand = nbBuckets[slot].find(p=>!usedNb.has(p.nearby_place_id) && !p.adds_extra_days);
      if(cand){ usedNb.add(cand.nearby_place_id);
        slots[slot] = {type:'nearby', name:cand.nearby_place_name, note:cand.recommendation_note, cost:(cand.transport_cost_roundtrip_bdt||0)+(cand.entry_activity_fee_bdt||0), transport:cand.transport_mode, duration:cand.visit_duration_hours, distance:cand.distance_km};
        return;
      }
      const a2 = nextOnsite(slot);
      if(a2){ slots[slot] = {type:'onsite', name:a2.n, note:(a2.t?a2.t+' activity':'On-site activity'), cost:a2.c||0, transport:'On foot / local', duration:a2.h}; }
    });
    const dayCost = Object.values(slots).filter(Boolean).reduce((s,x)=>s+(x.cost||0),0) + (d.avg_meal_cost_bdt||0)*3 + (day<days || days===1 ? (d.avg_accommodation_cost_bdt||0) : 0);
    days_out.push({day, slots, dayCost});
  }
  return days_out;
}
function calcBudget(d, itinerary, days, people){
  const nights = Math.max(0, days-1);
  const accommodation = (d.avg_accommodation_cost_bdt||0) * nights;
  const food = (d.avg_meal_cost_bdt||0) * 3 * days;
  const activityCosts = itinerary.reduce((s,day)=> s + Object.values(day.slots).filter(Boolean).reduce((a,x)=>a+(x.cost||0),0), 0);
  const entry = d.entry_fee_bdt||0;
  const guide = (d.guide_required==='Yes' || d.guide_recommended==='Yes') ? (d.guide_avg_cost_per_day_bdt||0)*days : 0;
  const total = accommodation+food+activityCosts+entry+guide;
  return {accommodation, food, activityCosts, entry, guide, total, perPerson: total, nights};
}

  const tp = sel.tripParams;
  const days = tp.duration;
  const itinerary = buildItinerary(d, days, tp.people);
  const budget = calcBudget(d, itinerary, days, tp.people);
  const nb = nearbyFor(d.place_id);
  const cats = Array.from(new Set(nb.map(n=>n.category)));
  const filteredNb = state.nearbyFilter==='all' ? nb : nb.filter(n=>n.category===state.nearbyFilter);
  const gmaps = (d.latitude && d.longitude) ? `https://www.google.com/maps?q=${d.latitude},${d.longitude}` : null;

  const dayCards = itinerary.map(day=>`
    <div class="day-card">
      <h4>Day ${day.day}</h4>
      ${['morning','afternoon','evening'].map(slot=>{
        const s = day.slots[slot];
        if(!s) return '';
        return `<div class="slot"><div class="tm">${slot[0].toUpperCase()+slot.slice(1)}</div>
          <div><div style="font-weight:500;">${s.name}</div><div style="color:var(--ink-soft);font-size:12.5px;margin-top:2px;">${s.note||''} ${s.distance?` \u00b7 ${s.distance} km \u00b7 ${s.transport}`:''}</div></div>
          <div class="cost">${s.cost?fmtBDT(s.cost):'Free'}</div></div>`;
      }).join('')}
      <div class="slot"><div class="tm">Food</div><div>${d.local_cuisine_specialty||'Local cuisine \u2014 information unavailable'}</div><div class="cost"></div></div>
      ${day.day<days?`<div class="slot"><div class="tm">Stay</div><div>${(d.accommodation_types||'Information unavailable').split(',')[0]}</div><div class="cost">${fmtBDT(d.avg_accommodation_cost_bdt)}</div></div>`:''}
      <div class="day-total">Estimated day cost: ${fmtBDT(day.dayCost)}</div>
    </div>`).join('');

  return `
    <div class="detail-hero">
      <div class="terrain-art" style="background:linear-gradient(135deg, ${catColor(d.terrain_key)}, ${catColor(d.terrain_key)}99);">${(TERRAIN_LABEL[d.terrain_key]||{e:'\ud83d\udccd'}).e}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
          <h1>${d.name} <span style="font-size:20px;color:var(--ink-soft);font-weight:400;">${d.name_bn||''}</span></h1>
          <div style="color:var(--ink-soft);font-size:14px;">${d.district}, ${d.division} \u00b7 ${TERRAIN_LABEL[d.terrain_key]?.t||d.terrain_type}</div>
        </div>
        ${sel.matchScore?`<div class="match-badge">${sel.matchScore}% match</div>`:''}
      </div>
      <div class="detail-facts">
        <div><b>Best months</b>${(d.best_months||'').split(',').map(n=>MONTHS[parseInt(n)]||n).join(', ')}</div>
        <div><b>Ideal days</b>${d.minimum_days_recommended}\u2013${d.maximum_useful_days}</div>
        <div><b>Budget tier</b>${d.budget_tier||'\u2014'}</div>
        <div><b>Difficulty</b>${'\u25cf'.repeat(d.physical_difficulty||1)}${'\u25cb'.repeat(Math.max(0,5-(d.physical_difficulty||1)))}</div>
        <div><b>Data quality</b><span class="quality-flag">${(d.data_quality_status||'').replace(/_/g,' ')}</span></div>
      </div>
      <div style="margin-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);">
        <span>Planning for: ${tp.people} traveler${tp.people>1?'s':''}, ${days} day${days>1?'s':''}, ${MONTHS[tp.month]}</span>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button class="btn small" data-save-trip>Save Trip</button>
        <button class="btn ghost small" data-share-trip>Share Trip</button>
        <button class="btn ghost small" data-go="home">Start Over</button>
      </div>
    </div>

    ${renderValidation(d, itinerary, days, tp, budget.total)}

    <div class="block">
      <h2>Overview</h2>
      <p style="font-size:14.5px;line-height:1.6;color:var(--ink-soft);">${d.experience_tags||''} destination in ${d.district}. ${d.local_market_shopping ? '' : ''}${d.what_not_to_do ? '' : ''}Suitable accommodation types: ${d.accommodation_types||'Information unavailable'}.</p>
    </div>

    <div class="block">
      <h2>Map</h2>
      ${d.latitude && d.longitude ? `
        <div style="border:1px solid var(--line);position:relative;background:var(--sand);">
          <iframe title="Map of ${d.name}" loading="lazy" width="100%" height="320" style="border:0;display:block;"
            src="https://www.google.com/maps?q=${d.latitude},${d.longitude}&z=12&output=embed"></iframe>
        </div>
        <a class="map-link" href="${gmaps}" target="_blank" rel="noopener" style="margin-top:10px;">\u2197 Open ${d.name} in Google Maps (${d.latitude.toFixed(4)}, ${d.longitude.toFixed(4)})</a>
        <p class="note">If the map above doesn't load, use the link instead \u2014 it opens the same real coordinates directly in Google Maps.</p>
      ` : `<p class="note">Map location unavailable \u2014 coordinates are missing for this destination in our dataset.</p>`}
      <h3 class="serif" style="font-size:16px;margin:26px 0 4px;">Nearby places \u2014 distance overview</h3>
      <p class="note" style="margin-top:0;">Our nearby-places dataset records distance, time and cost, but not individual coordinates \u2014 so we can't plot them as map pins without guessing their location. This shows them positioned by distance only.</p>
      ${renderNearbyRadial(nb, d)}
    </div>

    <div class="block">
      <h2>Day-wise itinerary</h2>
      ${dayCards}
    </div>

    <div class="block">
      <h2>Budget</h2>
      <table class="cost-table">
        <tr><td>Accommodation (${budget.nights} night${budget.nights!==1?'s':''})</td><td>${fmtBDT(budget.accommodation)}</td></tr>
        <tr><td>Food (3 meals \u00d7 ${days} days)</td><td>${fmtBDT(budget.food)}</td></tr>
        <tr><td>Activities, entry & local transport</td><td>${fmtBDT(budget.activityCosts+budget.entry)}</td></tr>
        ${budget.guide?`<tr><td>Guide (${days} day${days>1?'s':''})</td><td>${fmtBDT(budget.guide)}</td></tr>`:''}
        <tr class="total"><td>Local trip cost per person</td><td>${fmtBDT(budget.total)}</td></tr>
      </table>
      <p class="note">This is your local trip cost only. Round-trip transportation from ${tp.departure||'your departure district'} isn't in our dataset yet \u2014 budget for it separately. For ${tp.people} traveler${tp.people>1?'s':''}, total local cost is approximately ${fmtBDT(budget.total*tp.people)}.</p>
    </div>

    <div class="block">
      <h2>Things to carry</h2>
      <div class="pack-list">${(d.what_to_carry||'Information unavailable').split(/[,;]/).map(x=>x.trim()).filter(Boolean).map(x=>`<div>\u2022 ${x}</div>`).join('')}</div>
    </div>

    <div class="block">
      <h2>Safety &amp; permits</h2>
      ${d.permit_required==='Yes'?`<span class="badge-warn">\u26a0 Permit required</span>`:''}
      ${d.foreigner_friendly && d.foreigner_friendly!=='Yes'?`<span class="badge-warn">Limited foreigner access</span>`:''}
      <div class="safety-card"><b>Safety notes</b>${d.safety_notes||'Information unavailable'}</div>
      ${d.permit_required==='Yes'?`<div class="safety-card"><b>Permit</b>${d.permit_type||''} \u2014 ${d.permit_notes||''}</div>`:''}
      <div class="safety-card"><b>Local customs</b>${d.local_customs_respect||'Information unavailable'}</div>
      <div class="safety-card"><b>Scam risk</b>${d.scam_risk||'Information unavailable'}</div>
      <div class="safety-card"><b>Nearest hospital</b>${d.nearest_hospital_name?`${d.nearest_hospital_name} (${d.nearest_hospital_km} km)`:'Information unavailable'}</div>
      <div class="safety-card"><b>Emergency contacts</b>${d.emergency_contacts||'Information unavailable'}</div>
    </div>

    <div class="block">
      <h2>Seasonal intelligence</h2>
      <div class="season-grid">
        <div class="season-box"><div class="k">Your travel month</div><div class="v">${MONTHS[tp.month]}</div></div>
        <div class="season-box"><div class="k">Season match</div><div class="v">${seasonScore(d,tp.month)>=90?'Excellent':seasonScore(d,tp.month)>=70?'Good':seasonScore(d,tp.month)<=25?'Poor':'Fair'}</div></div>
        <div class="season-box"><div class="k">Crowd this month</div><div class="v">${(d.crowd_level_by_month||'').match(new RegExp(MONTHS[tp.month].slice(0,3)+':([A-Za-z ]+)'))?.[1]?.trim()||'\u2014'}</div></div>
      </div>
      <p class="note">Worst months to visit: ${(d.worst_months||'').split(',').map(n=>MONTHS[parseInt(n)]||n).join(', ')||'None noted'}. ${d.monsoon_impact?('Monsoon impact: '+d.monsoon_impact+'.'):''}</p>
    </div>

    <div class="block">
      <h2>Nearby places</h2>
      ${nb.length ? `
      <div class="cat-filters">
        <span class="tag-pill" style="cursor:pointer;background:${state.nearbyFilter==='all'?'var(--forest)':'transparent'};color:${state.nearbyFilter==='all'?'var(--paper)':'var(--ink-soft)'};" data-nearby-filter="all">All (${nb.length})</span>
        ${cats.map(c=>`<span class="tag-pill" style="cursor:pointer;background:${state.nearbyFilter===c?'var(--forest)':'transparent'};color:${state.nearbyFilter===c?'var(--paper)':'var(--ink-soft)'};" data-nearby-filter="${c}">${TERRAIN_LABEL[c]?.t||c}</span>`).join('')}
      </div>
      ${filteredNb.map(n=>`
        <div class="nearby-row">
          <div><span class="nm">${n.nearby_place_name}</span><br><span class="cat">${TERRAIN_LABEL[n.category]?.t||n.category} \u00b7 ${n.recommendation_note||''}</span></div>
          <div>${n.distance_km} km</div>
          <div>${n.travel_time_one_way_mins} min \u00b7 ${n.transport_mode}</div>
          <div>${fmtBDT((n.transport_cost_roundtrip_bdt||0)+(n.entry_activity_fee_bdt||0))}</div>
          <div>${n.adds_extra_days?'+1 day':n.visit_duration_hours+'h visit'}</div>
        </div>`).join('')}
      ` : `<div class="empty">No nearby attractions are currently available in our dataset.</div>`}
    </div>
  `;
}

function renderValidation(d, itinerary, days, tp, totalCost){
  const v = validateItinerary(d, itinerary, days, tp, totalCost);
  if(v.isValid && !v.warnings.length) return '';
  return `
    <div class="block" style="margin-bottom:28px;">
      <div class="safety-card" style="border-left-color:${v.isValid?'var(--forest-2)':'var(--clay)'};">
        <b>${v.isValid?'Plan check \u2014 passed with notes':'Plan check \u2014 conflicts found'}</b>
        ${v.errors.length?`<ul class="warn-list" style="margin-top:6px;">${v.errors.map(e=>`<li>\u2715 ${e}</li>`).join('')}</ul>`:''}
        ${v.warnings.length?`<ul class="warn-list" style="margin-top:6px;">${v.warnings.map(w=>`<li>\u26a0 ${w}</li>`).join('')}</ul>`:''}
      </div>
    </div>`;
}
function renderNearbyRadial(nb, d){
  if(!nb.length) return '<p class="note">No nearby attractions are currently available in our dataset.</p>';
  const max = Math.max(...nb.map(n=>n.distance_km), 1);
  const cx=210, cy=140, R=110;
  const pts = nb.slice(0,14).map((n,i)=>{
    const angle = (i/Math.min(14,nb.length))*2*Math.PI - Math.PI/2;
    const r = 22 + (n.distance_km/max)*R;
    const x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
    return `<g><circle cx="${x}" cy="${y}" r="5" fill="${catColor(n.category)}" opacity="0.85"/><title>${n.nearby_place_name} \u2014 ${n.distance_km} km</title></g>`;
  }).join('');
  const cats = Array.from(new Set(nb.map(n=>n.category)));
  return `
    <svg width="100%" height="260" viewBox="0 0 420 280" style="max-width:420px;display:block;">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-dasharray="3,4"/>
      <circle cx="${cx}" cy="${cy}" r="${R/2}" fill="none" stroke="var(--line)" stroke-dasharray="3,4"/>
      <circle cx="${cx}" cy="${cy}" r="9" fill="var(--forest)"/>
      <text x="${cx}" y="${cy-14}" font-size="11" fill="var(--ink)" text-anchor="middle" font-family="Work Sans">${d.name}</text>
      ${pts}
      <text x="${cx+R+6}" y="${cy}" font-size="9" fill="var(--ink-soft)" font-family="Work Sans">~${max} km</text>
    </svg>
    <p class="note">Distance from ${d.name}, positioned by relative distance only (not true geographic direction). Colors indicate category.</p>
    <div class="radial-legend">${cats.map(c=>`<span><span class="legend-dot" style="background:${catColor(c)}"></span>${TERRAIN_LABEL[c]?.t||c}</span>`).join('')}</div>
  `;
}

/* ---------- EXPLORE ---------- */
function viewExplore(){
  const list = DATA.destinations.slice(0,40);
  return `
    <h2 class="serif" style="font-size:28px;margin-bottom:16px;">All destinations</h2>
    ${list.map(d=>`
      <div class="trip-card">
        <div>
          <b style="font-family:'Fraunces',serif;font-size:16px;">${d.name}</b>
          <div style="font-size:12.5px;color:var(--ink-soft);">${d.district}, ${d.division} \u00b7 ${TERRAIN_LABEL[d.terrain_key]?.t||d.terrain_type} \u00b7 ${fmtBDT(d.overall_daily_budget_mid_bdt)}/day</div>
        </div>
        <button class="btn ghost small" data-open-dest="${d.place_id}">View</button>
      </div>`).join('')}
    ${DATA.destinations.length>40?`<p class="note">Showing 40 of ${DATA.destinations.length}. Use search on the home page to find a specific one.</p>`:''}
  `;
}

/* ---------- MY TRIPS ---------- */
async function loadTrips(){
  try{
    const listed = await window.storage.list('trip:', false);
    if(!listed || !listed.keys.length) return [];
    const trips = [];
    for(const k of listed.keys){
      try{ const r = await window.storage.get(k, false); if(r) trips.push(JSON.parse(r.value)); }catch(e){}
    }
    return trips;
  }catch(e){ return []; }
}
function viewMyTrips(){
  setTimeout(async ()=>{
    const trips = await loadTrips();
    const el = $('#mytrips-list');
    if(!el) return;
    el.innerHTML = trips.length ? trips.map(t=>`
      <div class="trip-card">
        <div><b style="font-family:'Fraunces',serif;font-size:16px;">${t.name}</b><div style="font-size:12.5px;color:var(--ink-soft);">${t.days} days \u00b7 ${t.people} traveler(s) \u00b7 ${fmtBDT(t.total)} estimated</div></div>
        <button class="btn ghost small" data-open-dest="${t.placeId}">View Plan</button>
      </div>`).join('') : `<div class="empty">You haven't saved any trips yet.</div>`;
  },0);
  return `<h2 class="serif" style="font-size:28px;margin-bottom:16px;">My Trips</h2><div id="mytrips-list"><div class="empty">Loading\u2026</div></div>`;
}

/* ---------- events ---------- */
function openDestinationQuick(placeId, matchScore){
  const d = DATA.destinations.find(x=>x.place_id===placeId);
  const p = state.prefs;
  const tripParams = {
    duration: p.duration || d.ideal_days || 3,
    people: p.people || 2,
    month: p.month || (new Date().getMonth()+1),
    departure: p.departure || '',
    budget: p.budget || 0,
    pet: p.pet||false, accessibility: p.accessibility||false, child: p.child||false,
  };
  setState({view:'detail', selected:{placeId, matchScore, tripParams}});
}
function bindEvents(){
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', ()=>setState({view:el.dataset.go, nearbyFilter:'all'})));
  document.querySelectorAll('[data-terrain-chip]').forEach(el=>el.addEventListener('click', ()=>{
    setState({view:'category', categoryKey:el.dataset.terrainChip});
  }));
  document.querySelectorAll('[data-set-traveler]').forEach(el=>el.addEventListener('click', ()=>{
    setState({prefs:{...state.prefs, traveler:el.dataset.setTraveler}});
  }));
  document.querySelectorAll('[data-set-accom]').forEach(el=>el.addEventListener('click', ()=>{
    setState({prefs:{...state.prefs, accommodation:el.dataset.setAccom}});
  }));
  document.querySelectorAll('[data-toggle-flag]').forEach(el=>el.addEventListener('click', ()=>{
    const k=el.dataset.toggleFlag;
    setState({prefs:{...state.prefs, [k]:!state.prefs[k]}});
  }));
  document.querySelectorAll('[data-toggle-terrain]').forEach(el=>el.addEventListener('click', ()=>{
    const k=el.dataset.toggleTerrain; const cur=state.prefs.terrain;
    const next = cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];
    setState({prefs:{...state.prefs, terrain:next}});
  }));
  document.querySelectorAll('[data-toggle-exp]').forEach(el=>el.addEventListener('click', ()=>{
    const k=el.dataset.toggleExp; const cur=state.prefs.experience;
    const next = cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];
    setState({prefs:{...state.prefs, experience:next}});
  }));
  document.querySelectorAll('[data-toggle-act]').forEach(el=>el.addEventListener('click', ()=>{
    const k=el.dataset.toggleAct; const cur=state.prefs.activities;
    const next = cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];
    setState({prefs:{...state.prefs, activities:next}});
  }));
  document.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('change', ()=>{
    const k=el.dataset.bind; let v=el.value;
    if(['duration','people','budget','month','crowd'].includes(k)) v=parseInt(v,10)||0;
    setState({prefs:{...state.prefs, [k]:v}});
  }));
  const submitA = $('[data-submit-formA]');
  if(submitA) submitA.addEventListener('click', ()=>{
    const p = state.prefs;
    const errs = [];
    if(!p.duration || p.duration<1) errs.push('Trip duration must be at least 1 day.');
    if(p.duration>30) errs.push('Trip duration looks unrealistic \u2014 please enter 30 days or fewer.');
    if(!p.people || p.people<1) errs.push('Number of travelers must be at least 1.');
    if(p.budget<0) errs.push('Budget cannot be negative.');
    if(errs.length){ setState({formErrors:errs}); return; }
    const results = runRecommendation(p);
    setState({results, view:'resultsA', formErrors:[]});
  });
  document.querySelectorAll('[data-view-plan]').forEach(el=>el.addEventListener('click', ()=>{
    openDestinationQuick(el.dataset.viewPlan, parseInt(el.dataset.match,10));
  }));
  document.querySelectorAll('[data-open-dest]').forEach(el=>el.addEventListener('click', ()=>{
    openDestinationQuick(el.dataset.openDest, null);
  }));
  document.querySelectorAll('[data-nearby-filter]').forEach(el=>el.addEventListener('click', ()=>{
    setState({nearbyFilter:el.dataset.nearbyFilter});
  }));
  const saveBtn = $('[data-save-trip]');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const d = DATA.destinations.find(x=>x.place_id===state.selected.placeId);
    const tp = state.selected.tripParams;
    const itinerary = buildItinerary(d, tp.duration, tp.people);
    const budget = calcBudget(d, itinerary, tp.duration, tp.people);
    const trip = {id:'trip_'+Date.now(), placeId:d.place_id, name:d.name, days:tp.duration, people:tp.people, total:budget.total, savedAt:Date.now()};
    try{ await window.storage.set('trip:'+trip.id, JSON.stringify(trip), false); toast('Trip saved'); }
    catch(e){ toast('Could not save trip'); }
  });
  const shareBtn = $('[data-share-trip]');
  if(shareBtn) shareBtn.addEventListener('click', ()=>{
    const d = DATA.destinations.find(x=>x.place_id===state.selected.placeId);
    const url = location.href.split('#')[0] + '#/trip/ghurbesobai-' + d.place_id.toLowerCase();
    navigator.clipboard?.writeText(url).catch(()=>{});
    toast('Trip link copied');
  });
  const hs = $('#home-search');
  if(hs) hs.addEventListener('input', ()=>{
    const drop = $('#home-search-drop');
    const matches = searchMatches(hs.value);
    drop.innerHTML = matches.length ? `<div class="search-drop">${renderSearchDrop(matches)}</div>` : '';
    document.querySelectorAll('#home-search-drop [data-open-dest]').forEach(el=>el.addEventListener('click', ()=>openDestinationQuick(el.dataset.openDest,null)));
  });
  const fbs = $('#formb-search');
  if(fbs) fbs.addEventListener('input', ()=>{ state.searchQ = fbs.value; const matches=searchMatches(fbs.value);
    $('#formb-search-drop').innerHTML = fbs.value && matches.length ? `<div class="search-drop">${renderSearchDrop(matches)}</div>` : '';
    document.querySelectorAll('#formb-search-drop [data-open-dest]').forEach(el=>el.addEventListener('click', ()=>openDestinationQuick(el.dataset.openDest,null)));
  });
}

render();
</script>
